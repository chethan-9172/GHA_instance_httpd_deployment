---
name: instance deployment

on:
  push:
    branches:
        - main

jobs:
    deployment:
        runs-on: ubuntu-latest

        steps:
          - name: checkout
            uses: actions/checkout@v7

           - name: key importing
             run: |
               echo "${{ secrets.AWS_KEY }}" > key.pem
               chmod 400 key.pem

          - name: copying the files
            run: scp -o StrictHostKeyChecking=no -i key.pem -r * ${{ vars.AWS_USER}}@${{ secrets.AWS_IP}}:/var/www/html