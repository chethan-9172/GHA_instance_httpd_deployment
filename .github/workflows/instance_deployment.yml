---
name: instance deployment

on:
  push:
    branches:
        - main

jobs:
    deployment:
        runs-on: ubuntu-latest

        steps:
          - name: checkout
            uses: actions/checkout@v7

          - name: copying the files
            run: sudo scp -o StrictHostKeyChecking=no -i ${{ secrets.AWS_KEY }}* ${{ vars.AWS_USER}}@${{ secrets.AWS_IP}}:/var/www/html